name: 'Common.FluentValidation CI'

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'src/Common.FluentValidation/**'
      - 'src/Common.FluentValidation.Tests/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/Common.FluentValidation/**'
      - 'src/Common.FluentValidation.Tests/**'

permissions:
  contents: read
  pull-requests: read

env:
  LIBRARY_PROJECT_PATH: Common.FluentValidation/JK.Common.FluentValidation.csproj
  TEST_PROJECT_PATH: Common.FluentValidation.Tests/JK.Common.FluentValidation.Tests.csproj

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.x
          9.x
          8.x
    - name: Build 
      run: dotnet build $LIBRARY_PROJECT_PATH -c Release
    - name: Format 
      run: dotnet format $LIBRARY_PROJECT_PATH --severity error --verify-no-changes
    - name: Test 
      run: dotnet test $TEST_PROJECT_PATH --verbosity normal
