name: 'Common.Polyfills CI'

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'src/Common.Polyfills/**'
      - 'src/Common.Polyfills.Tests/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/Common.Polyfills/**'
      - 'src/Common.Polyfills.Tests/**'

permissions:
  contents: read
  pull-requests: read

env:
  LIBRARY_PROJECT_PATH: ./src/Common.Polyfills/JK.Common.Polyfills.csproj
  TEST_PROJECT_PATH: ./src/Common.Polyfills.Tests/JK.Common.Polyfills.Tests.csproj

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x
    - name: Build 
      run: dotnet build $LIBRARY_PROJECT_PATH -c Release
    - name: Format 
      run: dotnet format $LIBRARY_PROJECT_PATH --severity error --verify-no-changes
    - name: Test 
      run: dotnet test $TEST_PROJECT_PATH --verbosity normal
