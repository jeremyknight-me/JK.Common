name: 'Common.EFCore CI'

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'src/Common.EntityFrameworkCore/**'
      - 'src/Common.EntityFrameworkCore.Tests/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/Common.EntityFrameworkCore/**'
      - 'src/Common.EntityFrameworkCore.Tests/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    uses: ./.github/workflows/dotnet-parameterized.yml
    with:
      library_project: Common.EntityFrameworkCore/JK.Common.EntityFrameworkCore.csproj
      test_projects: |
        Common.EntityFrameworkCore.Tests/JK.Common.EntityFrameworkCore.Tests.csproj
      runs_on: ubuntu-latest
      dotnet_versions: |
        10.x
        9.x
        8.x
