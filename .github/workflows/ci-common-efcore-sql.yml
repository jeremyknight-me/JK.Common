
name: 'Common.EFCore.SqlServer CI'

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'src/Common.EntityFrameworkCore.SqlServer/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/Common.EntityFrameworkCore.SqlServer/**'

permissions:
  contents: read
  pull-requests: read

env:
  LIBRARY_PROJECT_PATH: Common.EntityFrameworkCore.SqlServer/JK.Common.EntityFrameworkCore.SqlServer.csproj

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.x
          9.x
          8.x
    - name: Build
      run: dotnet build $LIBRARY_PROJECT_PATH -c Release
    - name: Format 
      run: dotnet format $LIBRARY_PROJECT_PATH --severity error --verify-no-changes
