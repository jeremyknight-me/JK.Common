
name: 'Common.EFCore.SqlServer CI'

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'src/Common.EntityFrameworkCore.SqlServer/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/Common.EntityFrameworkCore.SqlServer/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    uses: ./.github/workflows/dotnet-parameterized.yml
    with:
      library_project: Common.EntityFrameworkCore.SqlServer/JK.Common.EntityFrameworkCore.SqlServer.csproj
      runs_on: ubuntu-latest
      dotnet_versions: |
        10.x
        9.x
        8.x
